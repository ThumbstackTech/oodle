<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 110">
  <!-- Oodle-style loaf cat, fast asleep: chunky ink outline, flat fill + shade + glossy shine, tail tucked round -->
  <!-- body loaf + head bump with ears -->
  <path d="M22 96 C 10 96, 8 82, 12 70 C 16 56, 26 50, 40 48 L 46 26 L 60 40 C 68 37, 80 37, 88 40 L 102 26 L 106 50 C 128 50, 152 58, 158 76 C 162 90, 154 98, 140 98 Z" fill="#cc652b" stroke="#0c180e" stroke-width="6" stroke-linejoin="round"/>
  <!-- shade along the bottom/back -->
  <path d="M110 58 C 132 60, 150 68, 154 80 C 156 90, 150 94, 140 94 L 104 94 C 128 86, 130 70, 110 58 Z" fill="#a14f1f"/>
  <!-- inner ears -->
  <path d="M48 36 L 46 46 L 55 43 Z" fill="#a14f1f"/>
  <path d="M100 36 L 102 46 L 93 43 Z" fill="#a14f1f"/>
  <!-- tabby stripes on the back -->
  <g fill="none" stroke="#a14f1f" stroke-width="5" stroke-linecap="round">
    <path d="M122 60 L 118 70"/>
    <path d="M134 64 L 130 74"/>
    <path d="M70 41 L 71 49"/>
    <path d="M80 41 L 79 49"/>
  </g>
  <!-- glossy shine -->
  <ellipse cx="34" cy="62" rx="8" ry="4.5" transform="rotate(-30 34 62)" fill="#f7b98d"/>
  <ellipse cx="25" cy="72" rx="2.6" ry="2.1" fill="#f7b98d"/>
  <!-- tucked paws -->
  <ellipse cx="44" cy="94" rx="11" ry="6.5" fill="#f5e390" stroke="#0c180e" stroke-width="4.5"/>
  <ellipse cx="68" cy="95" rx="11" ry="6.5" fill="#f5e390" stroke="#0c180e" stroke-width="4.5"/>
  <!-- tail curled round the front -->
  <path d="M150 90 C 150 104, 110 104, 92 98" fill="none" stroke="#0c180e" stroke-width="15" stroke-linecap="round"/>
  <path d="M150 90 C 150 104, 110 104, 92 98" fill="none" stroke="#cc652b" stroke-width="8" stroke-linecap="round"/>
  <!-- sleepy face -->
  <path d="M55 64 C 58 68, 63 68, 66 64" fill="none" stroke="#0c180e" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M82 64 C 85 68, 90 68, 93 64" fill="none" stroke="#0c180e" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M71 72 L 74 75 L 77 72" fill="#0c180e" stroke="#0c180e" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M68 79 C 71 82, 73 81, 74 78 C 75 81, 77 82, 80 79" fill="none" stroke="#0c180e" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="50" cy="74" rx="4.5" ry="2.5" fill="#ea3d39" opacity="0.5"/>
  <ellipse cx="98" cy="74" rx="4.5" ry="2.5" fill="#ea3d39" opacity="0.5"/>
  <g stroke="#0c180e" stroke-width="2.4" stroke-linecap="round">
    <path d="M44 72 L 34 70"/>
    <path d="M104 72 L 114 70"/>
  </g>
  <!-- zzz -->
  <g fill="none" stroke="#0c180e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 30 L 120 30 L 112 38 L 120 38"/>
    <path d="M126 14 L 136 14 L 126 24 L 136 24"/>
  </g>
</svg>
